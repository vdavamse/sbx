[package]
name = "sbx"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
description = "Run untrusted commands in a locked-down Linux sandbox"

# The root package is its own single-member workspace. spikes/ holds
# standalone experiment packages (issue #1's nft-load spike) with their own
# manifests, lockfiles and CI — excluding the directory keeps them out of
# the workspace whether or not it exists yet (verified both ways).
[workspace]
exclude = ["spikes"]

[dependencies]
clap = { version = "4.6", features = ["derive"] }
# HTTP/1 request-line + Host parsing for the transparent proxy's port-80
# inspector (issue #7). Zero deps; no declared rust-version — same situation
# as netlink-bindings: the exact pin + `--locked` + the MSRV CI job are the
# guarantee (precedent: the netlink-bindings entry below).
httparse = "=1.10.1"
humantime = "2.4"
idna = "1.1"
libc = { version = "0.2", default-features = false }
# Optional Landlock layer (issue #19, `--landlock`): the exec shim inside the
# sandbox (src/landlock) applies the filesystem, TCP-bind and signal-scope
# rules. Pure Rust (static-musl OK); rust-version 1.71 <= MSRV 1.85; MIT OR
# Apache-2.0. Its transitive crates are enumflags2 and thiserror (both pure
# Rust, both already allowed by deny.toml's license list). Used only in the
# `sbx` binary's shim path and in the forked unit tests; no `default-features`
# knob exists, so the default feature set is taken as-is.
landlock = "0.4.7"
# DNS wire codec for the fake-IP resolver (issue #9): protocol only — no
# resolver, no runtime, NO features (default-features off drops "std" +
# "tokio"; the DNSSEC/TLS/HTTPS/QUIC code stays uncompiled, which the
# RUSTSEC-2026-0118 ignore in deny.toml depends on). Exact pin: 0.26.x
# declares rust-version 1.88 > MSRV 1.85; 0.25.2 (rust-version 1.71.1) is
# probe-verified on rustc 1.85.0 and pure Rust (static-musl OK). Every
# datagram passes the hand-rolled header-count gate BEFORE the decoder
# runs (src/dns/wire.rs). Re-evaluate when MSRV >= 1.88.
hickory-proto = { version = "=0.25.2", default-features = false }
# Namespace/netlink plumbing for `sbx __init` (issue #5) — spike-verified
# exact pins (spikes/nft-load/FINDINGS.md): neither crate declares
# rust-version, so `=0.3.5` + `--locked` is the MSRV-1.85 guarantee.
netlink-bindings = { version = "=0.3.5", default-features = false, features = [
    "nftables", "rt-link", "rt-addr", "rt-route",
] }
netlink-socket2 = { version = "=0.3.5", default-features = false }
# TLS ClientHello inspection for the transparent proxy (issue #7) — NO crypto
# provider (default-features off): the Acceptor parse path needs none
# (`Accepted::into_connection` is NEVER called — TLS is passed through, not
# terminated) and the aarch64 static-musl leg requires a pure-Rust tree (no
# cc/cmake). Spike-verified on rustc 1.85.0: rustls 0.23.45, MSRV 1.71; floor
# raised to 0.23.46 for RUSTSEC-2026-0346..0349 (client-side paths, unused here).
# The crypto provider (ring) is pulled ONLY by the opt-in `tls-termination`
# feature (issue #17): the default build's tree stays pure Rust (no ring/cc),
# which the aarch64 static-musl leg depends on.
rustls = { version = "0.23.46", default-features = false, features = ["std"] }
schemars = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Single-threaded runtime for the transparent proxy (issue #7's body pins
# "tokio, single-threaded runtime"). lookup_host uses the blocking pool
# ("rt"); copy_bidirectional + the duplex test fakes ("io-util");
# accept/connect ("net"); decision/connect timeouts + accept backoff
# ("time"). Spike-verified 1.53.2. The "macros" feature is deliberately OFF
# (tests hand-roll their block_on).
tokio = { version = "1.53.2", features = ["rt", "net", "io-util", "time"] }

# Opt-in TLS termination (issue #17, feature `tls-termination`; see the
# [features] table below). Every crate here is optional and absent from the
# default build's dependency tree.
# Per-run ephemeral CA + leaf minting (issue #17, D3). `ring` provider only:
# the aws-lc-rs default would pull cmake/aws-lc-sys into the feature build.
# rcgen 0.14 declares rust-version 1.71; NameConstraints are built in.
rcgen = { version = "=0.14.7", optional = true, default-features = false, features = ["ring", "pem"] }
# Async TLS server (client-facing termination) and client (upstream, webpki
# verified) over the ring provider. No aws-lc-rs (see rcgen note above).
tokio-rustls = { version = "=0.26.6", optional = true, default-features = false, features = ["ring", "tls12"] }
# Mozilla root store for upstream verification (never disabled). CDLA-Permissive-2.0
# data license: listed in deny.toml for this feature.
webpki-roots = { version = "=1.0.11", optional = true }
# Certificate validity window for the per-run CA and its leaves (rcgen takes
# time::OffsetDateTime). The same 0.3.45 rcgen already resolves; "std" for now_utc.
time = { version = "=0.3.45", optional = true, default-features = false, features = ["std"] }

[features]
# Opt-in TLS termination for hosts with URL-path rules (issue #17). OFF by
# default: the default binary has no TLS interception and no crypto provider.
# Build: `cargo build --release --features tls-termination`.
tls-termination = ["dep:rcgen", "dep:tokio-rustls", "dep:webpki-roots", "dep:time", "rustls/ring"]

# Property tests for the egress matcher/guard (issue #4). Dev-only: never
# compiled into release binaries; 1.11 declares rust-version 1.85 = MSRV.
[dev-dependencies]
proptest = "1.11"

# Issue #5 integration suite: spawns the real binary inside real user+net
# namespaces. libtest is multithreaded, but unshare(CLONE_NEWUSER) requires
# a single-threaded process, so the suite hand-rolls its runner
# (SKIP-with-message where unprivileged userns is unavailable).
[[test]]
name = "sandbox_init"
harness = false

# Issue #7 integration suite: spawns the real binary inside real user+net
# namespaces and serves the handed-off transparent listener fd from the
# parent — the same single-threaded-process rationale and hand-rolled
# SKIP-with-message runner as sandbox_init above.
[[test]]
name = "sandbox_proxy"
harness = false

# Issue #11 integration suite: the real `sbx check` (probe, nested bwrap tiers
# with --disable-userns and a read-only /proc/sys) — hand-rolled SKIP-with-message
# runner, like the other harness = false suites.
[[test]]
name = "sandbox_check"
harness = false

# Issue #12 integration suite: the real `sbx gc` on real temp ROOTs, plus the
# mount-crossing scenarios inside a user+mount namespace (a child role that
# unshares) — hand-rolled SKIP-with-message runner, like the other suites.
[[test]]
name = "sandbox_gc"
harness = false

# Issue #10 integration suite: spawns the real `sbx run` (and the test binary
# itself as the payload role) — hand-rolled SKIP-with-message runner, like the
# other harness = false suites.
[[test]]
name = "sandbox_run"
harness = false

# Issue #13 conformance suite: drives the real `sbx check --conformance` and
# the hidden probe; libtest's threads would make the bounded process-group waits
# and the nested-namespace controls harder to reason about, the same rationale
# as the suites above (hand-rolled, SKIP-with-message).
[[test]]
name = "conformance"
harness = false
