name: ci

# CI for the sbx crate (issue #2).
#
# Deliberately NO path filters: if these checks ever become required status
# checks, a skipped run would hang PRs (skipped required checks never
# report). The root workspace excludes spikes/, so spike-only PRs run these
# jobs harmlessly; spikes/nft-load keeps its own path-filtered workflow
# (spike-nft.yml) and is never touched from here.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: the jobs only read the repo (checkout).
permissions:
  contents: read

# Supply chain: third-party actions are pinned to full commit SHAs (the human
# tag follows in a trailing comment) so a compromised tag force-push cannot
# execute in CI. Deliberate exemption: dtolnay/rust-toolchain's @stable and
# @1.85.0 refs are moving version branches by that action's design.
# Every job starts with step-security/harden-runner in `audit` mode: it
# fingerprints each job's outbound network calls — the detection layer for a
# compromised pinned commit or a malicious crate build script exfiltrating
# during CI. Audit mode blocks nothing except StepSecurity's global list of
# known-malicious endpoints. Follow-up: flip the build jobs to `block` with
# an allow-list (crates.io, Ubuntu archives, rustup endpoints) once the
# observed calls are stable.

# Superseded pushes to the same PR/branch cancel the running jobs: saves CI
# minutes and avoids two runs racing. Runs on main are exempt — they are the
# record that what landed on the default branch was green, so a later push
# must never cancel an in-flight one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: rustfmt
        run: cargo fmt --check

      - name: clippy (-D warnings)
        run: cargo clippy --all-targets --locked -- -D warnings

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Recorded MSRV (Cargo.toml rust-version): the edition-2024 floor and
      # exactly clap 4.6's own MSRV. Fails loudly if a future Cargo.lock
      # update needs a newer rustc.
      - uses: dtolnay/rust-toolchain@1.85.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: cargo check on the recorded MSRV
        run: cargo check --locked --all-targets

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: cargo test
        run: cargo test --locked

  build:
    name: build (${{ matrix.target }})
    runs-on: ubuntu-latest
    # Longer budget: release musl compile plus the aarch64 leg's apt-installed
    # cross toolchain.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Add musl target
        run: rustup target add "${{ matrix.target }}"

      # aarch64 leg only: the dependency tree is pure Rust and rustc ships
      # self-contained musl crt objects, so the Ubuntu cross toolchain is a
      # sufficient linker (the issue #1 spike proved the x86_64 analogue
      # with plain gcc). Documented fallback if this ever fails:
      # cargo-zigbuild.
      - name: Install aarch64 cross linker
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build (static musl release)
        run: cargo build --release --locked --target "${{ matrix.target }}"

      - name: Staticness asserts
        run: |
          BIN="target/${{ matrix.target }}/release/sbx"
          file "$BIN"
          # file(1) spells a fully static binary either "static-pie linked"
          # (x86_64 leg: host gcc defaults to PIE) or "statically linked"
          # (aarch64 leg: the cross toolchain links a non-PIE static
          # executable) — both mean no dynamic loader and no shared-library
          # dependencies. We keep each toolchain's default on purpose:
          # forcing one spelling via -C relocation-model=static would
          # sacrifice PIE/ASLR where the toolchain provides it — a real
          # security regression for a sandbox launcher.
          file "$BIN" | grep -qE "static(-pie|ally)? linked"
          # Arch-agnostic corroboration: static and static-pie binaries have
          # no PT_INTERP segment. ldd's wording varies by host toolchain and
          # foreign-arch binaries, so it is informational only (printed
          # below), never a gate.
          if readelf -lW "$BIN" | grep -q "INTERP"; then
            echo "FAIL: binary has a PT_INTERP segment (not static)"
            exit 1
          fi
          echo "ok: no PT_INTERP segment"
          ldd "$BIN" 2>&1 || true
          SIZE=$(stat -c %s "$BIN")
          echo "binary_bytes=$SIZE"
          echo "${{ matrix.target }}: $SIZE bytes, static" >> "$GITHUB_STEP_SUMMARY"

      # x86_64 leg only: the aarch64 binary cannot execute on this runner
      # (qemu is deliberately out of scope). set +e + explicit rc checks so
      # a failure prints the captured logs instead of aborting opaquely
      # (spike precedent).
      - name: Smoke-run the built binary
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          BIN=target/x86_64-unknown-linux-musl/release/sbx
          set +e
          FAIL=0

          check_rc() { # <expected-rc> <actual-rc> <label>
            if [ "$2" -ne "$1" ]; then
              echo "FAIL: $3 exited $2 (expected $1)"
              FAIL=1
            else
              echo "ok: $3 exited $2"
            fi
          }

          HELP=$("$BIN" --help 2>&1)
          check_rc 0 $? "sbx --help"
          echo "$HELP" | grep -q "run"   || { echo "FAIL: help lacks 'run'"; FAIL=1; }
          echo "$HELP" | grep -q "check" || { echo "FAIL: help lacks 'check'"; FAIL=1; }
          echo "$HELP" | grep -q "gc"    || { echo "FAIL: help lacks 'gc'"; FAIL=1; }
          if echo "$HELP" | grep -q "__init"; then
            echo "FAIL: help leaks hidden '__init'"
            FAIL=1
          else
            echo "ok: help hides __init"
          fi

          # Each stub parses its documented interface, then exits 1 with
          # "not implemented" on stderr. The policy/session files need not
          # exist — the stubs never read them.
          "$BIN" run --policy p.json --session-dir /tmp/s -- true > /dev/null 2> run.err
          check_rc 1 $? "sbx run (stub)"
          grep -q "not implemented" run.err || { echo "FAIL: run stderr:"; cat run.err; FAIL=1; }

          "$BIN" run --policy p.json --session-dir /tmp/s -- /bin/echo --help > /dev/null 2>&1
          check_rc 1 $? "sbx run with hyphenated trailing args (stub)"

          "$BIN" check --policy p.json > /dev/null 2> check.err
          check_rc 1 $? "sbx check (stub)"
          grep -q "not implemented" check.err || { echo "FAIL: check stderr:"; cat check.err; FAIL=1; }

          "$BIN" gc --older-than 7d /tmp/root > /dev/null 2> gc.err
          check_rc 1 $? "sbx gc (stub)"
          grep -q "not implemented" gc.err || { echo "FAIL: gc stderr:"; cat gc.err; FAIL=1; }

          "$BIN" __init > /dev/null 2> init.err
          check_rc 1 $? "sbx __init (hidden stub)"
          grep -q "not implemented" init.err || { echo "FAIL: __init stderr:"; cat init.err; FAIL=1; }

          # Exit-code contract: 2 = usage error (cli.rs module docs / README).
          # The unit tests pin clap's ErrorKinds; these pin the exit code a
          # scripting caller actually observes from the shipped static binary.
          "$BIN" run --policy p.json --session-dir /tmp/s > /dev/null 2>&1
          check_rc 2 $? "sbx run without a trailing command (usage error)"

          "$BIN" gc --older-than abc /tmp/root > /dev/null 2>&1
          check_rc 2 $? "sbx gc with a bad --older-than (usage error)"

          "$BIN" gc --older-than 0s /tmp/root > /dev/null 2>&1
          check_rc 2 $? "sbx gc with a zero --older-than (usage error)"

          exit "$FAIL"

  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Bundled cargo-deny (0.20.x) runs `cargo deny check` — advisories,
      # licenses, bans and sources — against the root deny.toml and the
      # committed Cargo.lock. No inputs needed; defaults are exactly the
      # full check on ./Cargo.toml.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
