name: ci

# CI for the sbx crate (issue #2).
#
# Deliberately NO path filters: if these checks ever become required status
# checks, a skipped run would hang PRs (skipped required checks never
# report). The root workspace excludes spikes/, so spike-only PRs run these
# jobs harmlessly; spikes/nft-load keeps its own path-filtered workflow
# (spike-nft.yml) and is never touched from here.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: the jobs only read the repo (checkout).
permissions:
  contents: read

# Supply chain: third-party actions are pinned to full commit SHAs (the human
# tag follows in a trailing comment) so a compromised tag force-push cannot
# execute in CI. Deliberate exemption: dtolnay/rust-toolchain's @stable and
# @1.85.0 refs are moving version branches by that action's design.
# Every job starts with step-security/harden-runner in `audit` mode: it
# fingerprints each job's outbound network calls — the detection layer for a
# compromised pinned commit or a malicious crate build script exfiltrating
# during CI. Audit mode blocks nothing except StepSecurity's global list of
# known-malicious endpoints. Follow-up: flip the build jobs to `block` with
# an allow-list (crates.io, Ubuntu archives, rustup endpoints) once the
# observed calls are stable.

# Superseded pushes to the same PR/branch cancel the running jobs: saves CI
# minutes and avoids two runs racing. Runs on main are exempt — they are the
# record that what landed on the default branch was green, so a later push
# must never cancel an in-flight one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: rustfmt
        run: cargo fmt --check

      - name: clippy (-D warnings)
        run: cargo clippy --all-targets --locked -- -D warnings

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Recorded MSRV (Cargo.toml rust-version): the edition-2024 floor and
      # exactly clap 4.6's own MSRV. Fails loudly if a future Cargo.lock
      # update needs a newer rustc.
      - uses: dtolnay/rust-toolchain@1.85.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: cargo check on the recorded MSRV
        run: cargo check --locked --all-targets

  test:
    runs-on: ubuntu-latest
    # 20 (was 10): the issue #10 end-to-end smoke builds the musl release binary.
    timeout-minutes: 20
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Netns/nftables preparation for the issue #5 integration suite
      # (tests/sandbox_init.rs), modeled on the spike's spike-nft.yml prep.
      # harden-runner above stays compatible: the job runs in `audit` mode,
      # which fingerprints but blocks nothing except known-malicious
      # endpoints; when this job is ever flipped to `block` mode, the
      # allow-list must include the Ubuntu archive endpoints for the
      # apt-get step below (same traffic the build job's cross-linker step
      # already exercises).
      - name: Prepare environment (userns, nftables, modules)
        run: |
          uname -a
          id
          # Ubuntu 24.04+ AppArmor restricts unprivileged user namespaces.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo apt-get update
          sudo apt-get install -y nftables bubblewrap
          # Preload modules the ruleset needs (may be builtins; ignore errors).
          sudo modprobe -a nf_tables nft_fib nft_fib_ipv4 nft_redir nft_cmp \
            nft_meta nft_immediate nf_nat nft_counter || true
          # Issue #34 (review): load vsock so the smoke's AF_VSOCK assertion can
          # discriminate on the runner (without the module the host itself gives
          # EAFNOSUPPORT and the 97 inside the sandbox proves nothing). May be a
          # builtin or absent; ignore errors, the smoke reports which case holds.
          sudo modprobe vsock_loopback || sudo modprobe vsock || true
          # Smoke test: unprivileged user+net namespace must work.
          unshare -Urn true
          echo "unprivileged userns smoke OK"
          bwrap --version

      - name: cargo test
        run: cargo test --locked

      # Issue #10: the real `sbx run` against the static musl release binary,
      # with bubblewrap from the prep step. Gating.
      - name: "Smoke: sbx run end-to-end (release musl)"
        run: |
          rustup target add x86_64-unknown-linux-musl
          cargo build --release --locked --target x86_64-unknown-linux-musl
          BIN=target/x86_64-unknown-linux-musl/release/sbx
          T=$(mktemp -d)
          cat > "$T/bench.json" <<'JSON'
          {"version":1,"filesystem":{"ro":["/usr"],"rw":[],"deny":[]},"network":{"mode":"transparent","allow":[],"ports":[]},"env":{"pass":[],"set":{}},"limits":{"timeout":"30s","output_bytes":1048576}}
          JSON
          set +e
          FAIL=0
          OUT=$("$BIN" run --policy "$T/bench.json" --session-dir "$T/s" -- /usr/bin/bash -c 'echo sbx-ok; exit 7')
          RC=$?
          [ "$RC" -eq 7 ] || { echo "FAIL: exit $RC (expected 7)"; FAIL=1; }
          [ "$OUT" = "sbx-ok" ] || { echo "FAIL: stdout was: $OUT"; FAIL=1; }
          "$BIN" run --policy "$T/bench.json" --session-dir "$T/s" --timeout 1s -- /usr/bin/sleep 30
          RC=$?
          [ "$RC" -eq 124 ] || { echo "FAIL: timeout exit $RC (expected 124)"; FAIL=1; }
          "$BIN" run --policy "$T/bench.json" --session-dir "$T/s" --audit "$T/a.jsonl" -- /usr/bin/true
          RC=$?
          [ "$RC" -eq 0 ] || { echo "FAIL: audited run exit $RC"; FAIL=1; }
          tail -n 1 "$T/a.jsonl" | grep -q '"event":"exit"' || { echo "FAIL: last audit row is not exit"; FAIL=1; }
          # Issue #12: gc collects a real session left by the runs above; the
          # bench.json and a.jsonl files are skipped silently.
          touch -d '2 days ago' "$T/s"
          OUT=$("$BIN" gc --older-than 1d "$T")
          RC=$?
          [ "$RC" -eq 0 ] && [ "$OUT" = "removed \"$T/s\"" ] && [ ! -e "$T/s" ] || { echo "FAIL: gc of a real session rc $RC: $OUT"; FAIL=1; }
          # Issue #34: the socket-family filter. AF_VSOCK (a channel that bypasses
          # the netns; live on VM-backed runners) and AF_PACKET fail with
          # EAFNOSUPPORT (errno 97) inside the sandbox, through socket(2), the
          # socketpair(2) variant, and a high-word family spelling (the kernel
          # keeps only the low 32 bits); AF_UNIX keeps working.
          # Host baseline (unfiltered, outside sbx): if socket(AF_VSOCK) works
          # here, the sandbox's errno 97 below is discriminating. If the host
          # also refuses it, say so (not a failure); the AF_PACKET line (EPERM on
          # the host, 97 in the sandbox) still proves the filter.
          HOST=$(python3 - <<'PY'
          import ctypes
          libc = ctypes.CDLL(None, use_errno=True)
          libc.syscall.restype = ctypes.c_long
          for label, fam in (("vsock", 40), ("packet", 17)):
              r = libc.syscall(ctypes.c_long(41), ctypes.c_long(fam), ctypes.c_long(1), ctypes.c_long(0))
              print("host", label, "ok" if r >= 0 else "errno %d" % ctypes.get_errno())
          PY
          )
          echo "$HOST"
          if printf '%s\n' "$HOST" | grep -qx 'host vsock ok'; then
            echo "host vsock baseline: socket(AF_VSOCK) works unfiltered; the sandbox errno 97 is discriminating"
          else
            echo "vsock unavailable on host — assertion not discriminating (the AF_PACKET line still proves the filter)"
          fi
          PROG=$(cat <<'PY'
          import ctypes, socket as s
          libc = ctypes.CDLL(None, use_errno=True)
          libc.syscall.restype = ctypes.c_long
          def raw(nr, *args):
              r = libc.syscall(ctypes.c_long(nr), *[ctypes.c_long(a) for a in args])
              return "ok" if r >= 0 else "errno %d" % ctypes.get_errno()
          pair = (ctypes.c_int * 2)()
          print("vsock", raw(41, 40, 1, 0))
          print("packet", raw(41, 17, 1, 0))
          print("hiword", raw(41, (1 << 32) | 40, 1, 0))
          print("socketpair-vsock", raw(53, 40, 1, 0, ctypes.addressof(pair)))
          s.socket(s.AF_UNIX, s.SOCK_STREAM).close()
          print("unix ok")
          PY
          )
          OUT=$("$BIN" run --policy "$T/bench.json" --session-dir "$T/s" -- /usr/bin/python3 -c "$PROG")
          RC=$?
          printf '%s\n' "$OUT" | grep -qx 'vsock errno 97' && printf '%s\n' "$OUT" | grep -qx 'packet errno 97' && printf '%s\n' "$OUT" | grep -qx 'hiword errno 97' && printf '%s\n' "$OUT" | grep -qx 'socketpair-vsock errno 97' && printf '%s\n' "$OUT" | grep -qx 'unix ok' && [ "$RC" -eq 0 ] || { echo "FAIL: socket-family filter rc $RC: $OUT"; FAIL=1; }
          exit "$FAIL"

      # Issue #11: the real `sbx check` on the runner (gating). Every host item
      # must be ok and the network mode transparent — the environment the
      # integration suites assume. The human report goes to the job summary.
      - name: "Smoke: sbx check (issue #11, gating)"
        run: |
          BIN=target/x86_64-unknown-linux-musl/release/sbx
          set +e
          FAIL=0
          "$BIN" check --json > check.json
          RC=$?
          [ "$RC" -eq 0 ] || { echo "FAIL: sbx check --json exit $RC (expected 0)"; FAIL=1; }
          python3 - check.json <<'PY' || FAIL=1
          import json, sys
          r = json.load(open(sys.argv[1]))
          # landlock is report-only (warn/skip allowed); every other item must be ok.
          bad = [c["id"] + "=" + c["status"] for c in r["capabilities"]
                 if c["id"] != "landlock" and c["status"] != "ok"]
          if r["network_mode"] != "transparent" or bad:
              print("FAIL: sbx check is not all-ok:", r["network_mode"], bad)
              print(json.dumps(r, indent=2))
              sys.exit(1)
          PY
          { echo '### sbx check (issue #11)'; echo '```'; "$BIN" check; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
          "$BIN" check --policy examples/default.json --host > /dev/null
          [ $? -eq 0 ] || { echo "FAIL: sbx check --policy examples/default.json --host"; FAIL=1; }
          exit "$FAIL"

      # Issue #13 (gating): the conformance suite on the release musl binary. PR1
      # state, asserted exactly: nothing FAILs; the 19 lab checks are
      # not-implemented skips and the 6 network checks are opt-in, so the command
      # exits 1 until the lab tier lands (the second PR flips this to rc 0).
      - name: "Conformance (release musl, gating)"
        run: |
          BIN=target/x86_64-unknown-linux-musl/release/sbx
          set +e
          FAIL=0
          "$BIN" check --conformance --json > conf.json
          RC=$?
          python3 - conf.json "$RC" <<'PY' || FAIL=1
          import json, sys
          r = json.load(open(sys.argv[1]))
          rc = int(sys.argv[2])
          assert r["kind"] == "conformance" and r["version"] == 1, r.get("kind")
          fails = [c["id"] for c in r["checks"] if c["status"] == "fail"]
          assert not fails, f"FAIL checks: {fails}"
          lab = {"A02", "A03", "A04", "A05", "A06", "A12", "B01", "B02", "B03", "B04", "B05", "B06", "B07", "B08", "B09", "C02", "C07", "F02", "F04"}
          net = {"E01", "E02", "E03", "E04", "E05", "E06"}
          non_ok = {c["id"]: (c["status"], c.get("skip_kind")) for c in r["checks"] if c["status"] not in ("ok", "warn")}
          want = {i: ("skip", "not-implemented") for i in lab} | {i: ("skip", "opt-in") for i in net}
          assert non_ok == want, f"unexpected non-ok set: {non_ok}"
          assert rc == 1, f"rc {rc} (PR1 expects 1)"
          PY
          python3 - conf.json >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          s = json.load(open(sys.argv[1]))["summary"]
          print("### sbx check --conformance (issue #13)")
          print(f"{s['ok']} ok, {s['fail']} FAIL, {s['warn']} warn, {s['capability_skips']} capability skip, {s['not_implemented']} not implemented, {s['opt_in_skips']} opt-in")
          PY
          exit "$FAIL"

      # Issue #11 negative tier (gating): nested inside bwrap --disable-userns,
      # user namespaces cannot be created (ENOSPC, E3), so `check` reports the
      # userns item and `run` refuses with rc 125. Inside a read-only /proc/sys
      # (Docker-style, E4), the IPv6 stage reports EROFS (errno 30).
      - name: "Negative tier (no userns, read-only /proc/sys)"
        run: |
          BIN=target/x86_64-unknown-linux-musl/release/sbx
          set +e
          FAIL=0
          bwrap --unshare-user --disable-userns --dev-bind / / -- "$BIN" check --json > nonest.json
          RC=$?
          [ "$RC" -eq 1 ] || { echo "FAIL: nested check rc $RC (expected 1)"; FAIL=1; }
          python3 - nonest.json <<'PY' || FAIL=1
          import json, sys
          r = json.load(open(sys.argv[1]))
          u = next(c for c in r["capabilities"] if c["id"] == "userns")
          assert r["network_mode"] == "unavailable", r["network_mode"]
          assert u["status"] == "fail" and u["errno"] == 28, u
          PY
          T=$(mktemp -d)
          cat > "$T/bench.json" <<'JSON'
          {"version":1,"filesystem":{"ro":["/usr"],"rw":[],"deny":[]},"network":{"mode":"transparent","allow":[],"ports":[]},"env":{"pass":[],"set":{}},"limits":{"timeout":"30s","output_bytes":1048576}}
          JSON
          bwrap --unshare-user --disable-userns --dev-bind / / -- "$BIN" run --policy "$T/bench.json" --session-dir "$T/s" -- /usr/bin/true 2> run.err
          RC=$?
          [ "$RC" -eq 125 ] || { echo "FAIL: nested run rc $RC (expected 125)"; FAIL=1; }
          grep -q "this host cannot run sandboxes" run.err || { echo "FAIL: nested run stderr:"; cat run.err; FAIL=1; }
          bwrap --unshare-user --unshare-pid --dev-bind / / --proc /proc --ro-bind /proc/sys /proc/sys -- "$BIN" check --json > rofs.json
          RC=$?
          [ "$RC" -eq 1 ] || { echo "FAIL: read-only /proc/sys check rc $RC (expected 1)"; FAIL=1; }
          python3 - rofs.json <<'PY' || FAIL=1
          import json, sys
          r = json.load(open(sys.argv[1]))
          v6 = next(c for c in r["capabilities"] if c["id"] == "netns-ipv6")
          assert v6["status"] == "fail" and v6["errno"] == 30, v6
          PY
          # Issue #13 nested negative tier: no sandbox can be built, so every host,
          # lab and init check is a capability skip (rc 1); the opt-in network checks
          # are still opt-in (rc 0 for them).
          bwrap --unshare-user --disable-userns --dev-bind / / -- "$BIN" check --conformance --json > confnest.json
          RC=$?
          [ "$RC" -eq 1 ] || { echo "FAIL: nested conformance rc $RC (expected 1)"; FAIL=1; }
          python3 - confnest.json <<'PY' || FAIL=1
          import json, sys
          r = json.load(open(sys.argv[1]))
          assert r["network_mode"] == "unavailable", r["network_mode"]
          for c in r["checks"]:
              if c["tier"] in ("host", "lab", "init"):
                  assert c["status"] == "skip" and c["skip_kind"] == "capability", (c["id"], c["status"], c.get("skip_kind"))
          PY
          exit "$FAIL"

      # Issue #10 AC3: startup overhead of `sbx run` over `bash -c true`. Report
      # only: the step never fails the job, and it warns at >= 25 ms overhead.
      - name: "Startup overhead (report-only, issue #10 AC3)"
        continue-on-error: true
        run: |
          sudo apt-get install -y hyperfine
          BIN=target/x86_64-unknown-linux-musl/release/sbx
          T=$(mktemp -d)
          cat > "$T/bench.json" <<'JSON'
          {"version":1,"filesystem":{"ro":["/usr"],"rw":[],"deny":[]},"network":{"mode":"transparent","allow":[],"ports":[]},"env":{"pass":[],"set":{}},"limits":{"timeout":"30s","output_bytes":1048576}}
          JSON
          hyperfine -N --warmup 10 --runs 100 --export-json "$T/startup.json" \
            "/usr/bin/bash -c true" \
            "$BIN run --policy $T/bench.json --session-dir $T/s -- /usr/bin/bash -c true"
          # Summary from the hyperfine JSON (1.x `times` or 2.x `measurements`);
          # the script never crashes on an unknown shape, it prints n/a instead.
          python3 .github/scripts/test_startup_summary.py > /dev/null \
            || echo "::warning::startup summary self-test failed"
          python3 .github/scripts/startup_summary.py "$T/startup.json" >> "$GITHUB_STEP_SUMMARY"

      # Issue #11 Docker tier (report-only): the default Docker seccomp profile
      # is expected to refuse nested unshare (EPERM, U_SECCOMP). Recorded in the
      # job summary; never fails the job.
      - name: "Docker tier (report-only)"
        continue-on-error: true
        run: |
          BIN=target/x86_64-unknown-linux-musl/release/sbx
          if ! command -v docker >/dev/null 2>&1; then
            echo "docker not available; skipped" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### Docker tier (report-only, issue #11)"
            echo '```json'
            docker run --rm -v "$PWD/$BIN:/sbx:ro" ubuntu:24.04 /sbx check --json || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" 2>&1 || true

      # Issue #11 AppArmor tier (sudo, gating): with the Ubuntu restriction on,
      # `check` reports the userns item as AppArmor-restricted (rc 1) and `run`
      # refuses with rc 125. Self-skips where the sysctl does not exist. The
      # sysctl is restored on exit, so the step leaves the runner as it found it.
      - name: "AppArmor tier (sudo; self-skips without the sysctl)"
        run: |
          SYSCTL=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [ ! -e "$SYSCTL" ]; then
            echo "SKIP: $SYSCTL is absent on this runner"
            exit 0
          fi
          BIN=target/x86_64-unknown-linux-musl/release/sbx
          ORIG=$(cat "$SYSCTL")
          trap 'sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns="$ORIG" >/dev/null' EXIT
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=1
          set +e
          FAIL=0
          "$BIN" check --json > aa.json
          RC=$?
          [ "$RC" -eq 1 ] || { echo "FAIL: sbx check under AppArmor rc $RC (expected 1)"; FAIL=1; }
          python3 - aa.json <<'PY' || FAIL=1
          import json, sys
          r = json.load(open(sys.argv[1]))
          u = next(c for c in r["capabilities"] if c["id"] == "userns")
          assert u["status"] == "fail" and "AppArmor" in u["detail"], u
          print("observed AppArmor evidence:", u["evidence"], "errno:", u["errno"])
          PY
          T=$(mktemp -d)
          cat > "$T/bench.json" <<'JSON'
          {"version":1,"filesystem":{"ro":["/usr"],"rw":[],"deny":[]},"network":{"mode":"transparent","allow":[],"ports":[]},"env":{"pass":[],"set":{}},"limits":{"timeout":"30s","output_bytes":1048576}}
          JSON
          "$BIN" run --policy "$T/bench.json" --session-dir "$T/s" -- /usr/bin/true 2> aa.err
          RC=$?
          [ "$RC" -eq 125 ] || { echo "FAIL: sbx run under AppArmor rc $RC (expected 125)"; FAIL=1; }
          grep -q "restricted by AppArmor" aa.err || { echo "FAIL: sbx run stderr:"; cat aa.err; FAIL=1; }
          exit "$FAIL"

  build:
    name: build (${{ matrix.target }})
    runs-on: ubuntu-latest
    # Longer budget: release musl compile plus the aarch64 leg's apt-installed
    # cross toolchain.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Add musl target
        run: rustup target add "${{ matrix.target }}"

      # aarch64 leg only: the dependency tree is pure Rust and rustc ships
      # self-contained musl crt objects, so the Ubuntu cross toolchain is a
      # sufficient linker (the issue #1 spike proved the x86_64 analogue
      # with plain gcc). Documented fallback if this ever fails:
      # cargo-zigbuild.
      - name: Install aarch64 cross linker
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build (static musl release)
        run: cargo build --release --locked --target "${{ matrix.target }}"

      - name: Staticness asserts
        run: |
          BIN="target/${{ matrix.target }}/release/sbx"
          file "$BIN"
          # file(1) spells a fully static binary either "static-pie linked"
          # (x86_64 leg: host gcc defaults to PIE) or "statically linked"
          # (aarch64 leg: the cross toolchain links a non-PIE static
          # executable) — both mean no dynamic loader and no shared-library
          # dependencies. We keep each toolchain's default on purpose:
          # forcing one spelling via -C relocation-model=static would
          # sacrifice PIE/ASLR where the toolchain provides it — a real
          # security regression for a sandbox launcher.
          file "$BIN" | grep -qE "static(-pie|ally)? linked"
          # Arch-agnostic corroboration: static and static-pie binaries have
          # no PT_INTERP segment. ldd's wording varies by host toolchain and
          # foreign-arch binaries, so it is informational only (printed
          # below), never a gate.
          if readelf -lW "$BIN" | grep -q "INTERP"; then
            echo "FAIL: binary has a PT_INTERP segment (not static)"
            exit 1
          fi
          echo "ok: no PT_INTERP segment"
          ldd "$BIN" 2>&1 || true
          SIZE=$(stat -c %s "$BIN")
          echo "binary_bytes=$SIZE"
          echo "${{ matrix.target }}: $SIZE bytes, static" >> "$GITHUB_STEP_SUMMARY"

      # x86_64 leg only: the aarch64 binary cannot execute on this runner
      # (qemu is deliberately out of scope). set +e + explicit rc checks so
      # a failure prints the captured logs instead of aborting opaquely
      # (spike precedent).
      - name: Smoke-run the built binary
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          BIN=target/x86_64-unknown-linux-musl/release/sbx
          set +e
          FAIL=0

          check_rc() { # <expected-rc> <actual-rc> <label>
            if [ "$2" -ne "$1" ]; then
              echo "FAIL: $3 exited $2 (expected $1)"
              FAIL=1
            else
              echo "ok: $3 exited $2"
            fi
          }

          HELP=$("$BIN" --help 2>&1)
          check_rc 0 $? "sbx --help"
          echo "$HELP" | grep -q "run"   || { echo "FAIL: help lacks 'run'"; FAIL=1; }
          echo "$HELP" | grep -q "check" || { echo "FAIL: help lacks 'check'"; FAIL=1; }
          echo "$HELP" | grep -q "gc"    || { echo "FAIL: help lacks 'gc'"; FAIL=1; }
          if echo "$HELP" | grep -q "__init"; then
            echo "FAIL: help leaks hidden '__init'"
            FAIL=1
          else
            echo "ok: help hides __init"
          fi
          # Issue #13 (no namespaces needed): the conformance catalog and usage errors.
          if echo "$HELP" | grep -q "__conformance"; then
            echo "FAIL: help leaks hidden '__conformance'"
            FAIL=1
          fi
          LIST=$("$BIN" check --conformance --list 2>&1)
          check_rc 0 $? "sbx check --conformance --list"
          [ "$(echo "$LIST" | grep -c '^  [A-H][0-9][0-9]  ')" -eq 69 ] || { echo "FAIL: --list is not 69 rows"; FAIL=1; }
          "$BIN" check --conformance --list --json | python3 -c 'import json,sys; assert len(json.load(sys.stdin)["checks"]) == 69' || { echo "FAIL: --list --json is not 69 checks"; FAIL=1; }
          "$BIN" check --conformance --only Z99 > /dev/null 2>&1
          check_rc 2 $? "sbx check --conformance --only Z99"
          echo '{"version":1,"filesystem":{"ro":["/usr"],"rw":[],"deny":[]},"network":{"mode":"transparent","allow":[],"ports":[]},"env":{"pass":[],"set":{}},"limits":{"timeout":"30s","output_bytes":1048576}}' > conf-policy.json
          "$BIN" check --conformance --policy conf-policy.json > /dev/null 2>&1
          check_rc 2 $? "sbx check --conformance --policy"

          # `run` is real since #10: a missing policy is an sbx-detected
          # failure (rc 125, "sbx run: " prefix on stderr). `gc` is real (#12).
          "$BIN" run --policy p.json --session-dir /tmp/s -- true > /dev/null 2> run.err
          check_rc 125 $? "sbx run (missing policy)"
          grep -q "sbx run: " run.err || { echo "FAIL: run stderr:"; cat run.err; FAIL=1; }
          grep -q "cannot read" run.err || { echo "FAIL: run stderr lacks 'cannot read':"; cat run.err; FAIL=1; }

          "$BIN" run --policy p.json --session-dir /tmp/s -- /bin/echo --help > /dev/null 2>&1
          check_rc 125 $? "sbx run with hyphenated trailing args (missing policy)"

          "$BIN" run --policy p.json --session-dir /tmp/s --timeout 0s -- true > /dev/null 2>&1
          check_rc 2 $? "sbx run with a zero --timeout (usage error)"

          # check is real since issue #3: it validates a policy file (rc 0
          # valid / rc 1 invalid-or-unreadable, "sbx check: <reason>" on
          # stderr) and prints the JSON Schema with --print-schema (rc 0).
          # rc 2 stays clap-only (missing/conflicting flags). The shipped
          # examples double as the valid fixtures; the invalid one is a
          # heredoc (relative path — the most basic rejection).
          "$BIN" check --policy examples/default.json > /dev/null 2> check.err
          check_rc 0 $? "sbx check examples/default.json"
          if [ -s check.err ]; then
            echo "FAIL: check wrote to stderr on success:"; cat check.err; FAIL=1
          fi

          "$BIN" check --policy examples/locked-down.json > /dev/null 2> check.err
          check_rc 0 $? "sbx check examples/locked-down.json"

          cat > check-invalid.json <<'EOF'
            {
              "version": 1,
              "filesystem": { "ro": ["usr"], "rw": [], "deny": [] },
              "network": { "mode": "none", "allow": [], "ports": [] },
              "env": { "pass": [], "set": {} },
              "limits": { "timeout": "120s", "output_bytes": 10485760 }
            }
          EOF

          "$BIN" check --policy check-invalid.json > /dev/null 2> check.err
          check_rc 1 $? "sbx check (invalid policy)"
          grep -q "sbx check:" check.err || { echo "FAIL: check stderr:"; cat check.err; FAIL=1; }
          grep -q "absolute path" check.err || { echo "FAIL: check stderr lacks the reason:"; cat check.err; FAIL=1; }

          "$BIN" check --policy missing.json > /dev/null 2> check.err
          check_rc 1 $? "sbx check (missing policy file)"
          grep -q "cannot read" check.err || { echo "FAIL: missing-file stderr:"; cat check.err; FAIL=1; }

          "$BIN" check --print-schema > schema.json 2> check.err
          check_rc 0 $? "sbx check --print-schema"
          grep -q '"\$schema"' schema.json || { echo "FAIL: schema output lacks \$schema"; FAIL=1; }
          grep -q '"additionalProperties": false' schema.json || { echo "FAIL: schema output lacks additionalProperties"; FAIL=1; }

          # Broken pipe is silent success (Unix convention): a closed reader
          # must not turn into a panic (rc 101) and break the 0/1/2 contract.
          "$BIN" check --print-schema | true
          check_rc 0 ${PIPESTATUS[0]} "sbx check --print-schema to a closed pipe"

          # Issue #11: bare `check` is the host report now (rc 0 or 1 depending on
          # the runner; this job has no userns preparation); --json is versioned.
          "$BIN" check --json > host.json 2> /dev/null
          RC=$?
          if [ "$RC" -eq 0 ] || [ "$RC" -eq 1 ]; then
            echo "ok: sbx check --json rc $RC"
          else
            echo "FAIL: sbx check --json rc $RC (expected 0 or 1)"; FAIL=1
          fi
          grep -q '"version": 1' host.json || { echo "FAIL: host.json lacks version 1"; FAIL=1; }
          "$BIN" check --host > /dev/null 2>&1
          check_rc 2 $? "sbx check --host alone (usage error)"
          "$BIN" check --policy examples/default.json --json > /dev/null 2>&1
          check_rc 2 $? "sbx check --policy with --json and no --host (usage error)"

          "$BIN" check --policy examples/default.json --print-schema > /dev/null 2>&1
          check_rc 2 $? "sbx check --policy with --print-schema (usage error)"

          # Issue #12: real `sbx gc` on a scratch ROOT: dry run first (nothing
          # removed), then the real run; the young session stays; a missing
          # ROOT is refused (rc 1).
          mkdir -p gc-root/old gc-root/young
          : > gc-root/old/sbx.lock; : > gc-root/young/sbx.lock
          touch -d '10 days ago' gc-root/old
          "$BIN" gc --older-than 7d --dry-run gc-root > gc.out 2> gc.err
          check_rc 0 $? "sbx gc --dry-run"
          grep -qx 'would remove "gc-root/old"' gc.out || { echo "FAIL: gc dry-run stdout:"; cat gc.out; FAIL=1; }
          [ -d gc-root/old ] || { echo "FAIL: dry-run removed gc-root/old"; FAIL=1; }
          "$BIN" gc --older-than 7d gc-root > gc.out 2> gc.err
          check_rc 0 $? "sbx gc"
          grep -qx 'removed "gc-root/old"' gc.out || { echo "FAIL: gc stdout:"; cat gc.out; FAIL=1; }
          [ ! -e gc-root/old ] && [ -f gc-root/young/sbx.lock ] || { echo "FAIL: gc kept/removed the wrong sessions"; FAIL=1; }
          "$BIN" gc --older-than 7d gc-root/missing > /dev/null 2> gc.err
          check_rc 1 $? "sbx gc on a missing ROOT"
          grep -q "does not exist" gc.err || { echo "FAIL: gc stderr:"; cat gc.err; FAIL=1; }

          # __init is real since issue #5, but a full run needs a control
          # socketpair handed over by `run` (#10). The namespace-independent
          # contract stays deterministic on ANY runner: the control-fd
          # validation runs BEFORE unshare by design, so no userns/AppArmor
          # dependency leaks into the build job.
          "$BIN" __init > /dev/null 2>&1
          check_rc 2 $? "sbx __init without --fd (usage error)"

          "$BIN" __init --fd abc -- /bin/true > /dev/null 2>&1
          check_rc 2 $? "sbx __init with a non-numeric --fd (usage error)"

          "$BIN" __init --fd 999 -- /bin/true > /dev/null 2> init.err
          check_rc 1 $? "sbx __init --fd 999 (staged control-fd error)"
          grep -q "sbx __init: control:" init.err || { echo "FAIL: __init stderr:"; cat init.err; FAIL=1; }

          # Exit-code contract: 2 = usage error (cli.rs module docs / README).
          # The unit tests pin clap's ErrorKinds; these pin the exit code a
          # scripting caller actually observes from the shipped static binary.
          "$BIN" run --policy p.json --session-dir /tmp/s > /dev/null 2>&1
          check_rc 2 $? "sbx run without a trailing command (usage error)"

          "$BIN" gc --older-than abc /tmp/root > /dev/null 2>&1
          check_rc 2 $? "sbx gc with a bad --older-than (usage error)"

          "$BIN" gc --older-than 0s /tmp/root > /dev/null 2>&1
          check_rc 2 $? "sbx gc with a zero --older-than (usage error)"

          exit "$FAIL"

  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Bundled cargo-deny (0.20.x) runs `cargo deny check` — advisories,
      # licenses, bans and sources — against the root deny.toml and the
      # committed Cargo.lock. No inputs needed; defaults are exactly the
      # full check on ./Cargo.toml.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
